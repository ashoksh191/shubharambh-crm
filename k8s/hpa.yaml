apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shubharambh-backend-hpa
  namespace: shubharambh-production
  labels:
    app.kubernetes.io/name: shubharambh-crm
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shubharambh-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
