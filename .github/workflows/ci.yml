name: Shubharambh CRM CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    name: Install, Lint, Type Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Project Dependencies
        run: npm ci

      - name: 🧹 Execute Code Linting (Oxlint / ESLint)
        run: npm run lint

      - name: 🔍 Execute TypeScript Type Check
        run: npm run type-check

      - name: 🧪 Execute Vitest Test Suite
        run: npm run test

      - name: 🚀 Execute Production Build
        run: npm run build
